<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MAM Pixel Map · Elisa Live</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #101311; color: #eff3ea; font: 14px/1.45 system-ui, sans-serif }
  main { max-width: 1120px; margin: auto; padding: 20px clamp(12px, 3vw, 36px) }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: end; flex-wrap: wrap }
  h1 { margin: 0; font: 700 clamp(23px, 5vw, 42px)/1.1 system-ui }
  p { margin: 6px 0 12px; color: #c0cbbc }
  .controls { display: flex; gap: 6px; margin-bottom: 10px }
  button { font: inherit; color: inherit; background: transparent; border: 1px solid #637360; padding: 8px 12px; cursor: pointer }
  button[aria-pressed=true] { background: #b9ff88; color: #111710; border-color: #b9ff88 }
  svg { display: block; width: 100%; border: 1px solid #637360; color: #ffffff30 }
  .surface { fill: transparent; stroke: #e9f0e8; stroke-width: 12 }
  svg[data-mode=split] .surface { fill: var(--fill) }
  svg[data-mode=walls] .surface { fill: var(--fill) }
  svg[data-mode=walls] #floor { display: none }
  svg[data-mode=full] .split, svg[data-mode=split] .full, svg[data-mode=walls] .full { display: none }
  text { text-anchor: middle; fill: #f6faf3; font-size: 142px; font-weight: 700 }
  .dimension { font: 112px monospace }
  use { fill: #b9ff88 }
  footer { padding-top: 12px; color: #c0cbbc }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>MAM PIXEL MAP</h1><p>8038 × 5798 px · Elisa Live</p></div>
    <div class="controls" role="group" aria-label="Preset di uscita">
      <button type="button" data-mode="full" aria-pressed="true">Full Room</button>
      <button type="button" data-mode="split" aria-pressed="false">Superfici</button>
      <button type="button" data-mode="walls" aria-pressed="false">Solo pareti</button>
    </div>
  </header>
  <p id="mode-info" aria-live="polite">Un unico frame attraverso le superfici. Il bordo TOP punta verso Wall Nord.</p>
  <svg id="atlas" data-mode="full" viewBox="0 0 8038 5798" role="img" aria-labelledby="map-title">
    <title id="map-title">Mappa MAM, con Wall Nord a destra e senza Wall Stage</title>
    <defs>
      <pattern id="grid" width="200" height="200" patternUnits="userSpaceOnUse">
        <path d="M 200 0 H 0 V 200" fill="none" stroke="currentColor" stroke-width="9" />
      </pattern>
      <linearGradient id="full-frame" x1="0%" y1="100%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#202247" />
        <stop offset=".62" stop-color="#224750" />
        <stop offset="1" stop-color="#376645" />
      </linearGradient>
      <clipPath id="room-mask"><polygon points="1100,1200 4326,1200 5960,2108 6838,2108 6838,4598 1100,4598" />
        <polygon points="6838,2108 8038,2108 8038,4598 6838,4598" />
        <polygon points="0,1200 1100,1200 1100,4598 0,4598" />
        <polygon points="1100,100 4326,0 4326,1200 1100,1200" />
        <polygon points="4326,0 6192,0 6192,1200 4326,1200" />
        <polygon points="6192,0 7072,0 7072,1200 6192,1200" />
        <polygon points="1100,4598 4326,4598 4326,5798 1100,5698" />
        <polygon points="4326,4598 6838,4598 6838,5798 4326,5798" /></clipPath>
      <path id="arrow" d="M -105 40 L 0 -90 L 105 40 Z" />
    </defs>
    <rect width="8038" height="5798" fill="#080a09" />
    <g class="full" clip-path="url(#room-mask)">
      <rect width="8038" height="5798" fill="url(#full-frame)" />
      <rect width="8038" height="5798" fill="url(#grid)" />
      <path d="M 6980 0 V 5798" stroke="#b9ff88" stroke-width="36" />
    </g>
    <g id="floor">
      <polygon class="surface" points="1100,1200 4326,1200 5960,2108 6838,2108 6838,4598 1100,4598" style="--fill:#264b42" />
      <clipPath id="wall-0"><polygon points="1100,1200 4326,1200 5960,2108 6838,2108 6838,4598 1100,4598" /></clipPath>
      <rect class="split" x="1100" y="1200" width="5738" height="3398" fill="url(#grid)" clip-path="url(#wall-0)" />
      <g transform="translate(3969 3189)">
        <text>PAVIMENTO</text>
        <use class="split" href="#arrow" transform="translate(0 -210) rotate(90)" />
      </g>
    </g>
    <g>
      <polygon class="surface" points="6838,2108 8038,2108 8038,4598 6838,4598" style="--fill:#355e3e" />
      <clipPath id="wall-1"><polygon points="6838,2108 8038,2108 8038,4598 6838,4598" /></clipPath>
      <rect class="split" x="6838" y="2108" width="1200" height="2490" fill="url(#grid)" clip-path="url(#wall-1)" />
      <g transform="translate(7438 3353)">
        <text>WALL NORD</text>
        <text class="dimension" y="150">1200 × 2490</text>
        <use class="split" href="#arrow" transform="translate(0 -210) rotate(90)" />
      </g>
    </g>
    <g>
      <polygon class="surface" points="0,1200 1100,1200 1100,4598 0,4598" style="--fill:#323a66" />
      <clipPath id="wall-2"><polygon points="0,1200 1100,1200 1100,4598 0,4598" /></clipPath>
      <rect class="split" x="0" y="1200" width="1100" height="3398" fill="url(#grid)" clip-path="url(#wall-2)" />
      <g transform="translate(550 2899)">
        <text>WALL SUD</text>
        <use class="split" href="#arrow" transform="translate(0 -210) rotate(270)" />
      </g>
    </g>
    <g>
      <polygon class="surface" points="1100,100 4326,0 4326,1200 1100,1200" style="--fill:#4c3764" />
      <clipPath id="wall-3"><polygon points="1100,100 4326,0 4326,1200 1100,1200" /></clipPath>
      <rect class="split" x="1100" y="0" width="3226" height="1200" fill="url(#grid)" clip-path="url(#wall-3)" />
      <g transform="translate(2713 600)">
        <text>WALL WEST 1</text>
        <use class="split" href="#arrow" transform="translate(0 -210) rotate(0)" />
      </g>
    </g>
    <g>
      <polygon class="surface" points="4326,0 6192,0 6192,1200 4326,1200" style="--fill:#503654" />
      <clipPath id="wall-4"><polygon points="4326,0 6192,0 6192,1200 4326,1200" /></clipPath>
      <rect class="split" x="4326" y="0" width="1866" height="1200" fill="url(#grid)" clip-path="url(#wall-4)" />
      <g transform="translate(5259 600)">
        <text>WALL WEST 2</text>
        <use class="split" href="#arrow" transform="translate(0 -210) rotate(0)" />
      </g>
    </g>
    <g>
      <polygon class="surface" points="6192,0 7072,0 7072,1200 6192,1200" style="--fill:#365161" />
      <clipPath id="wall-5"><polygon points="6192,0 7072,0 7072,1200 6192,1200" /></clipPath>
      <rect class="split" x="6192" y="0" width="880" height="1200" fill="url(#grid)" clip-path="url(#wall-5)" />
      <g transform="translate(6632 600)">
        <text>WALL WEST 3</text>
        <use class="split" href="#arrow" transform="translate(0 -210) rotate(0)" />
      </g>
    </g>
    <g>
      <polygon class="surface" points="1100,4598 4326,4598 4326,5798 1100,5698" style="--fill:#4a4632" />
      <clipPath id="wall-6"><polygon points="1100,4598 4326,4598 4326,5798 1100,5698" /></clipPath>
      <rect class="split" x="1100" y="4598" width="3226" height="1200" fill="url(#grid)" clip-path="url(#wall-6)" />
      <g transform="translate(2713 5198)">
        <text>WALL EST 2</text>
        <use class="split" href="#arrow" transform="translate(0 -210) rotate(180)" />
      </g>
    </g>
    <g>
      <polygon class="surface" points="4326,4598 6838,4598 6838,5798 4326,5798" style="--fill:#374655" />
      <clipPath id="wall-7"><polygon points="4326,4598 6838,4598 6838,5798 4326,5798" /></clipPath>
      <rect class="split" x="4326" y="4598" width="2512" height="1200" fill="url(#grid)" clip-path="url(#wall-7)" />
      <g transform="translate(5582 5198)">
        <text>WALL EST 1</text>
        <use class="split" href="#arrow" transform="translate(0 -210) rotate(180)" />
      </g>
    </g>
    <g class="full" transform="translate(7440 4100)">
      <text x="-130" class="dimension">TOP</text>
      <use href="#arrow" x="210" y="-48" transform="rotate(90 210 -48)" />
    </g>
  </svg>
  <footer>Geometria del builder TouchDesigner, ricavata dalla tavola annotata. Il posizionamento va verificato sulle slice in Resolume.</footer>
</main>
<script>
  const map = document.querySelector("#atlas");
  const info = document.querySelector("#mode-info");
  const buttons = document.querySelectorAll("[data-mode][type=button]");
  buttons.forEach(button => button.addEventListener("click", () => {
    if (!map || !info) return;
    const mode = button.dataset.mode;
    map.dataset.mode = mode;
    info.textContent = mode === "walls"
      ? "Solo pareti, con il pavimento nero."
      : mode === "split"
      ? "Un ritaglio per superficie. Le frecce indicano dove punta il bordo TOP di ciascun ritaglio."
      : "Un unico frame attraverso le superfici. Il bordo TOP punta verso Wall Nord.";
    buttons.forEach(item => item.setAttribute("aria-pressed", String(item === button)));
  }));
</script>
